<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aggregator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='4' rx='1.2' fill='white'/%3E%3Crect x='5' y='10' width='14' height='4' rx='1.2' fill='white' fill-opacity='.7'/%3E%3Crect x='7' y='16' width='10' height='4' rx='1.2' fill='white' fill-opacity='.4'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Dark-first, X-platform palette. Keep-style masonry cards. */
  :root {
    --bg: #000;
    --surface: #16181c;
    --surface-2: #1d1f23;
    --border: #2f3336;
    --fg: #e7e9ea;
    --muted: #71767b;
    --accent: #1d9bf0;
    --chip: #202327;
    --chip-active: #eff3f4;
    --chip-active-fg: #0f1419;
    color-scheme: dark;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: var(--accent); text-decoration: none; word-break: break-word; }
  a:hover { text-decoration: underline; }

  header {
    position: sticky; top: env(safe-area-inset-top, 0px);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    padding-block: 12px;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: #000; z-index: 10;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .brand h1 {
    margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em;
  }
  .brand small { color: var(--muted); font-weight: 500; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search] {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid transparent;
    color: var(--fg);
    padding: 10px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 16px; /* prevents iOS auto-zoom on focus */
    outline: none;
    -webkit-appearance: none;
  }
  input[type=search]:focus { border-color: var(--accent); background: #000; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: var(--chip); color: var(--fg);
    border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; user-select: none;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .chip:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .chip.active { background: var(--chip-active); color: var(--chip-active-fg); border-color: var(--chip-active); }
  .chip .n { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .chip.active .n { color: #536471; }

  main { padding-block: 16px 60px; }

  .grid {
    column-count: 4;
    column-gap: 14px;
  }
  @media (max-width: 1100px) { .grid { column-count: 3; } }
  @media (max-width: 760px)  { .grid { column-count: 2; } }
  @media (max-width: 520px)  { .grid { column-count: 1; column-gap: 0; } }

  /* --- Mobile polish --- */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .brand h1 { font-size: 20px; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls input[type=search] { width: 100%; }
    .controls .mode-btn,
    .controls .publish-btn { align-self: flex-start; }
    .chips { gap: 5px; }
    .chip { padding: 4px 10px; font-size: 12px; }
    .card { padding: 12px 14px; margin-bottom: 10px; border-radius: 12px; }
    .card h3 { font-size: 14px; }
    .card .preview li { font-size: 13px; }

    /* Modal takes most of the screen on phones */
    .scrim { padding: 10px; align-items: flex-end; }
    .modal {
      max-width: 100%;
      max-height: calc(100vh - 20px);
      padding: 18px 18px 16px;
      border-radius: 16px 16px 10px 10px;
    }
    .modal h2, .m-title { font-size: 18px; }
    .modal li { font-size: 14px; padding: 10px 10px 10px 24px; }

    /* Add link row stacks vertically on phones */
    .add-row {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .add-row .add-btn {
      width: 100%; height: 40px; border-radius: 10px;
      align-self: stretch;
    }

    /* FAB a bit smaller on phones and clear of iOS home indicator */
    .fab {
      width: 52px; height: 52px; font-size: 26px;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
    }

    /* Row actions always visible on touch devices (no hover) */
    .modal li .row-actions { opacity: 1; }
  }

  /* No-hover devices: show link row actions by default */
  @media (hover: none) {
    .modal li .row-actions { opacity: 1; }
    .card:hover { transform: none; }
  }

  .card {
    break-inside: avoid;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: border-color 0.25s ease, transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background 0.25s ease;
  }
  .card:hover {
    border-color: var(--accent);
    background: var(--surface-2);
    box-shadow: 0 6px 22px rgba(0,0,0,0.5), 0 0 0 1px rgba(29,155,240,0.15);
    transform: translateY(-2px);
  }
  .card:active { transform: translateY(0) scale(0.995); transition-duration: 0.08s; }
  .card h3 {
    margin: 0 0 10px; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    letter-spacing: -0.01em;
  }
  .card h3 .tag {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .card .preview { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .card .preview li { font-size: 13.5px; line-height: 1.35; color: var(--fg); opacity: 0.92; }
  .card .preview .more { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* Modal — Keep-style centered expansion */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
    transition: background 0.3s ease, backdrop-filter 0.3s ease;
  }
  .scrim.open { display: flex; }
  .scrim.visible { background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%; max-width: 560px;
    max-height: calc(100vh - 40px);
    overflow: auto;
    padding: 22px 24px 20px;
    opacity: 0;
    transform: translateY(14px) scale(0.96);
    transition: opacity 0.3s cubic-bezier(.2,.8,.2,1), transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .scrim.visible .modal { opacity: 1; transform: none; }
  .modal h2 {
    margin: 0 0 4px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
  }
  .modal .cat {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 16px;
  }
  .modal ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
  .modal li {
    font-size: 15px; line-height: 1.4;
    position: relative;
    padding: 8px 10px 8px 24px;
    border-radius: 8px;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .modal li::before {
    content: "";
    position: absolute;
    left: 10px; top: 50%;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    transform: translateY(-50%);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .modal li:hover { background: var(--surface-2); }
  .modal li:hover::before { background: var(--accent); transform: translateY(-50%) scale(1.4); }
  .modal li a { display: block; color: var(--fg); }
  .modal li:hover a { color: var(--accent); }
  .modal li a:hover { text-decoration: none; }
  .modal .close {
    position: sticky; top: -22px; float: right;
    background: transparent; color: var(--muted); border: 0;
    font-size: 22px; cursor: pointer; padding: 2px 8px;
    border-radius: 999px; line-height: 1;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .modal .close:hover { background: var(--chip); color: var(--fg); }

  /* Editable title + category inputs */
  .m-title, .m-cat {
    background: transparent;
    border: 1px solid transparent;
    color: inherit;
    font: inherit;
    outline: none;
    display: block;
    border-radius: 6px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .m-title {
    font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
    padding: 4px 8px; margin: 0 0 4px -8px; width: calc(100% + 8px);
  }
  .m-cat {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 8px; margin: 0 0 16px -8px; width: calc(100% + 8px);
  }
  .m-title:hover, .m-cat:hover { background: var(--surface-2); }
  .m-title:focus, .m-cat:focus { background: var(--surface-2); border-color: var(--accent); }

  /* Link row actions */
  .modal li { display: flex; align-items: center; gap: 4px; padding-right: 6px; }
  .modal li a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-actions {
    display: flex; gap: 2px; opacity: 0;
    transition: opacity 0.15s ease;
  }
  .modal li:hover .row-actions { opacity: 1; }
  .row-actions button {
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 4px 7px; border-radius: 6px;
    font-size: 13px; line-height: 1; font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .row-actions button:hover { background: var(--chip); color: var(--fg); }
  .row-actions .del:hover { color: #f4212e; background: rgba(244,33,46,0.1); }

  /* Inline edit mode for a row */
  .modal li.editing { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; background: var(--surface-2); }
  .modal li.editing::before { display: none; }
  .modal li.editing input {
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    padding: 8px 10px; border-radius: 6px; font: inherit; font-size: 16px; outline: none;
    width: 100%;
  }
  .modal li.editing input:focus { border-color: var(--accent); }
  .modal li.editing .edit-row { display: flex; gap: 6px; justify-content: flex-end; }
  .modal li.editing .edit-row button {
    background: var(--chip); border: 0; color: var(--fg);
    padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 12px;
    font-weight: 700; cursor: pointer;
    transition: filter 0.15s ease;
  }
  .modal li.editing .edit-row .save { background: var(--accent); color: #fff; }
  .modal li.editing .edit-row button:hover { filter: brightness(1.15); }

  /* "Add link" row at bottom of modal */
  .add-row {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 6px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .add-row input {
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 12px; font-size: 16px; color: var(--fg);
    font-family: inherit; border-radius: 6px; outline: none;
    min-width: 0;
  }
  .add-row input:focus { border-color: var(--accent); background: var(--bg); }
  .add-row .add-btn {
    background: var(--accent); color: #fff; border: 0;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 22px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease, transform 0.15s ease;
    align-self: center;
  }
  .add-row .add-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
  .add-row .add-btn:active { transform: scale(0.95); }

  /* Modal footer */
  .m-footer { margin-top: 12px; display: flex; justify-content: flex-end; }
  .del-card {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 700;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .del-card:hover { color: #f4212e; border-color: #f4212e; background: rgba(244,33,46,0.08); }
  .del-card.confirm { background: #f4212e; color: #fff; border-color: #f4212e; }

  /* FAB — "add new card" */
  .fab {
    position: fixed;
    right: max(24px, env(safe-area-inset-right, 0px));
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 0;
    cursor: pointer; font-size: 28px; line-height: 1; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(29,155,240,0.4);
    z-index: 40;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), filter 0.15s ease, box-shadow 0.25s ease;
  }
  .fab:hover { transform: scale(1.08); filter: brightness(1.08); box-shadow: 0 6px 22px rgba(29,155,240,0.55); }
  .fab:active { transform: scale(0.95); }

  /* Modal body — override alignment while editing */
  .modal li .edit-view, .modal li .read-view { display: contents; }

  /* --- Mode: view (default) vs manage --- */
  /* The front page is read-only. Everything editable is hidden until manage mode. */
  body:not(.manage) .fab,
  body:not(.manage) .row-actions,
  body:not(.manage) .add-row,
  body:not(.manage) .m-footer { display: none; }
  body:not(.manage) .m-title,
  body:not(.manage) .m-cat {
    pointer-events: none;
    cursor: default;
  }
  body:not(.manage) .m-title:hover,
  body:not(.manage) .m-cat:hover { background: transparent; border-color: transparent; }

  /* Manage toggle in header */
  .mode-btn {
    background: var(--chip); color: var(--fg);
    border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .mode-btn:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
  body.manage #modeBtn {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  body.manage #modeBtn:hover { filter: brightness(1.1); }

  /* Publish button — only visible in manage mode */
  .publish-btn { display: none; }
  body.manage .publish-btn { display: inline-flex; }
  .publish-btn.dirty {
    background: #f0b429; color: #000; border-color: #f0b429;
    animation: pulse-dirty 1.6s ease-in-out infinite;
  }
  .publish-btn.dirty:hover { filter: brightness(1.08); color: #000; }
  @keyframes pulse-dirty {
    0%,100% { box-shadow: 0 0 0 0 rgba(240,180,41,0.55); }
    50%     { box-shadow: 0 0 0 6px rgba(240,180,41,0); }
  }
  .publish-btn[disabled] { opacity: 0.7; cursor: wait; }

  /* Subtle hint banner in manage mode */
  .manage-hint {
    display: none;
    background: rgba(29,155,240,0.08);
    border: 1px solid rgba(29,155,240,0.25);
    color: var(--accent);
    padding: 8px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    margin-top: 10px;
  }
  body.manage .manage-hint { display: block; }

  .empty { color: var(--muted); text-align: center; padding: 40px; }
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4"  width="18" height="4" rx="1.2" fill="currentColor"/>
        <rect x="5" y="10" width="14" height="4" rx="1.2" fill="currentColor" opacity=".7"/>
        <rect x="7" y="16" width="10" height="4" rx="1.2" fill="currentColor" opacity=".4"/>
      </svg>
      <h1>Aggregator</h1>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search…" autocomplete="off">
      <button class="mode-btn" id="modeBtn" aria-label="Toggle manage mode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span id="modeLabel">Manage</span>
      </button>
      <button class="mode-btn publish-btn" id="publishBtn" aria-label="Publish to GitHub">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L4 11l1.4 1.4L11 6.8V21h2V6.8l5.6 5.6L20 11z"/></svg>
        <span>Publish</span>
      </button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="manage-hint">Edit mode on — click a card to edit, use the + button to add a new one. Changes save to this browser only.</div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches.</div>
</main>

<button class="fab" id="fab" aria-label="New card" title="New card">+</button>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal">
    <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    <input class="m-title" id="mTitle" placeholder="Title" readonly>
    <input class="m-cat" id="mCat" placeholder="Category" list="catList" readonly>
    <datalist id="catList"></datalist>
    <ul id="mList"></ul>
    <div class="add-row">
      <input id="addName" placeholder="Name" autocomplete="off">
      <input id="addUrl" placeholder="https://…" autocomplete="off">
      <button class="add-btn" id="addBtn" aria-label="Add link">+</button>
    </div>
    <div class="m-footer">
      <button class="del-card" id="delCardBtn">Delete card</button>
    </div>
  </div>
</div>

  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // --- Persistence: remote data.json (shared) + local draft (per-browser) ---
  const DRAFT_KEY = 'aggregator.draft.v1';
  const DATA_URL  = './data.json';
  const REPO_OWNER = '1ch4k';
  const REPO_NAME  = 'aggregator';
  const DATA_PATH  = 'data.json';
  const BRANCH     = 'main';

  function loadDraft() {
    try { const raw = localStorage.getItem(DRAFT_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function saveData() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(DATA)); } catch (e) {}
    if (typeof publishBtn !== 'undefined' && publishBtn) publishBtn.classList.add('dirty');
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    if (publishBtn) publishBtn.classList.remove('dirty');
  }

  async function initialLoad() {
    // 1. Fetch the shared data.json from the deployed site (or repo)
    try {
      const resp = await fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' });
      if (resp.ok) {
        const parsed = await resp.json();
        if (Array.isArray(parsed) && parsed.length) DATA = parsed;
      }
    } catch (e) {}
    // 2. If this browser has an unpublished draft, it wins
    const draft = loadDraft();
    if (draft && Array.isArray(draft) && draft.length) {
      DATA = draft;
      if (publishBtn) publishBtn.classList.add('dirty');
    }
    renderChips();
    render();
  }

  async function publishToGitHub() {
    if (!authed || !pat) { const ok = await tryAuth(); if (!ok) return; }
    const base = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + DATA_PATH;
    const prevLabel = publishBtn.querySelector('span').textContent;
    publishBtn.querySelector('span').textContent = 'Publishing…';
    publishBtn.disabled = true;
    try {
      // GET current SHA (404 is fine, means data.json doesn't exist yet)
      let sha = null;
      const g = await fetch(base + '?ref=' + BRANCH, { headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json' } });
      if (g.ok) { sha = (await g.json()).sha; }
      else if (g.status !== 404) { throw new Error('GET ' + g.status + ': ' + (await g.text()).slice(0,180)); }
      // PUT new content
      const jsonStr = JSON.stringify(DATA, null, 2);
      const content = btoa(unescape(encodeURIComponent(jsonStr)));
      const body = { message: 'Update aggregator data', content, branch: BRANCH };
      if (sha) body.sha = sha;
      const p = await fetch(base, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + pat, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!p.ok) {
        if (p.status === 401 || p.status === 403) {
          forgetAuth();
          document.body.classList.remove('manage');
          location.hash = '';
        }
        throw new Error('PUT ' + p.status + ': ' + (await p.text()).slice(0,180));
      }
      clearDraft();
      publishBtn.querySelector('span').textContent = 'Published!';
      setTimeout(() => { publishBtn.querySelector('span').textContent = 'Publish'; publishBtn.disabled = false; }, 2500);
    } catch (e) {
      alert('Publish failed:\n' + e.message);
      publishBtn.querySelector('span').textContent = prevLabel;
      publishBtn.disabled = false;
    }
  }

  // --- DOM shortcuts ---
  const grid = document.getElementById('grid');
  const chipsEl = document.getElementById('chips');
  const q = document.getElementById('q');
  const emptyEl = document.getElementById('empty');
  const scrim = document.getElementById('scrim');
  const mTitle = document.getElementById('mTitle');
  const mCat = document.getElementById('mCat');
  const mList = document.getElementById('mList');
  const addName = document.getElementById('addName');
  const addUrl = document.getElementById('addUrl');
  const addBtn = document.getElementById('addBtn');
  const delCardBtn = document.getElementById('delCardBtn');
  const fab = document.getElementById('fab');
  const catList = document.getElementById('catList');
  const modeBtn = document.getElementById('modeBtn');
  const modeLabel = document.getElementById('modeLabel');
  const publishBtn = document.getElementById('publishBtn');

  let activeCat = 'All';
  let query = '';
  let currentIdx = -1;
  let editingLink = -1;

  // --- Mode (view / manage), gated by a GitHub PAT ---
  // One token does both: unlocks Manage mode AND publishes to GitHub.
  // Token is NEVER persisted — lives only as this JS variable, cleared on exit.
  let authed = false;
  let pat = null;

  function forgetAuth() {
    pat = null;
    authed = false;
  }

  async function tryAuth() {
    const input = window.prompt('GitHub Personal Access Token (fine-grained, contents:write on ' + REPO_OWNER + '/' + REPO_NAME + '):');
    if (!input) return false;
    try {
      const resp = await fetch('https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME, {
        headers: { 'Authorization': 'token ' + input, 'Accept': 'application/vnd.github+json' }
      });
      if (resp.ok) {
        pat = input;
        authed = true;
        return true;
      }
      if (resp.status === 401) { alert('Invalid or expired token.'); return false; }
      if (resp.status === 404) { alert('Token has no access to ' + REPO_OWNER + '/' + REPO_NAME + '.\nMake sure the fine-grained PAT selects this repo with Contents: Read and write.'); return false; }
      alert('Auth failed: HTTP ' + resp.status);
    } catch (e) {
      alert('Network error validating token: ' + e.message);
    }
    return false;
  }

  function readMode() {
    const want = location.hash.replace(/^#/, '') === 'manage';
    return (want && authed) ? 'manage' : 'view';
  }
  function applyMode() {
    const m = readMode();
    document.body.classList.toggle('manage', m === 'manage');
    modeLabel.textContent = m === 'manage' ? 'Done' : 'Manage';
    mTitle.readOnly = (m === 'view');
    mCat.readOnly = (m === 'view');
  }
  window.addEventListener('hashchange', async () => {
    const wantManage = location.hash.replace(/^#/, '') === 'manage';
    if (wantManage) {
      if (!authed) {
        const ok = await tryAuth();
        if (!ok) { history.replaceState(null, '', location.pathname + location.search); applyMode(); return; }
      }
    } else {
      forgetAuth(); // leaving manage mode: drop token from memory
    }
    applyMode();
    if (scrim.classList.contains('open')) renderModal();
  });
  modeBtn.addEventListener('click', async () => {
    if (readMode() === 'manage') { forgetAuth(); location.hash = ''; return; }
    const ok = await tryAuth();          // always prompts; nothing is remembered
    if (!ok) return;
    location.hash = 'manage';
  });

  // --- Chips ---
  function renderChips() {
    const cats = Array.from(new Set(DATA.map(d => d.cat)));
    const counts = Object.fromEntries(cats.map(c => [c, DATA.filter(d => d.cat === c).reduce((s,d) => s + d.items.length, 0)]));
    if (activeCat !== 'All' && !cats.includes(activeCat)) activeCat = 'All';
    chipsEl.innerHTML = '';
    const total = DATA.reduce((s,d) => s + d.items.length, 0);
    chipsEl.appendChild(chip('All', total));
    for (const c of cats) chipsEl.appendChild(chip(c, counts[c]));
    catList.innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
  }
  function chip(label, n) {
    const el = document.createElement('button');
    el.className = 'chip' + (label === activeCat ? ' active' : '');
    el.innerHTML = `${esc(label)}<span class="n">${n}</span>`;
    el.onclick = () => { activeCat = label; renderChips(); render(); };
    return el;
  }

  // --- Grid ---
  function render() {
    grid.innerHTML = '';
    let shown = 0;
    DATA.forEach((card, idx) => {
      if (activeCat !== 'All' && card.cat !== activeCat) return;
      const items = query
        ? card.items.filter(i => (i.name + ' ' + (i.url||'') + ' ' + card.title + ' ' + card.cat).toLowerCase().includes(query))
        : card.items;
      if (query && !items.length) return;
      shown += items.length;
      const preview = items.slice(0, 5);
      const extra = items.length - preview.length;
      const el = document.createElement('article');
      el.className = 'card';
      el.tabIndex = 0;
      el.innerHTML = `
        <h3>${esc(card.title)}<span class="tag">${esc(card.cat)}</span></h3>
        <ul class="preview">${
          items.length === 0
            ? '<li class="more">Empty — open to add links</li>'
            : preview.map(i => `<li>${esc(i.name)}</li>`).join('') + (extra > 0 ? `<li class="more">+ ${extra} more</li>` : '')
        }</ul>
      `;
      el.addEventListener('click', () => openModal(idx));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(idx); } });
      grid.appendChild(el);
    });
    emptyEl.hidden = !(query && shown === 0);
  }

  // --- Modal ---
  function openModal(idx) {
    currentIdx = idx;
    editingLink = -1;
    renderModal();
    scrim.classList.add('open');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => scrim.classList.add('visible')));
    (readMode() === 'manage' ? mTitle : document.getElementById('closeBtn')).focus();
  }
  function closeModal() {
    scrim.classList.remove('visible');
    document.body.style.overflow = '';
    delCardBtn.classList.remove('confirm');
    delCardBtn.textContent = 'Delete card';
    setTimeout(() => scrim.classList.remove('open'), 300);
    currentIdx = -1;
  }
  function renderModal() {
    if (currentIdx < 0 || currentIdx >= DATA.length) { closeModal(); return; }
    const card = DATA[currentIdx];
    mTitle.value = card.title;
    mCat.value = card.cat;
    if (card.items.length === 0) {
      mList.innerHTML = '<li style="color:var(--muted);justify-content:center">No links yet.</li>';
    } else {
      mList.innerHTML = card.items.map((i, k) => {
        if (editingLink === k) {
          return `<li class="editing">
            <input class="e-name" value="${esc(i.name)}" placeholder="Name">
            <input class="e-url"  value="${esc(i.url)}"  placeholder="https://…">
            <div class="edit-row">
              <button class="cancel" data-act="cancel">Cancel</button>
              <button class="save"   data-act="save" data-k="${k}">Save</button>
            </div>
          </li>`;
        }
        return `<li>
          <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>
          <span class="row-actions">
            <button data-act="edit" data-k="${k}" aria-label="Edit">&#9998;</button>
            <button class="del" data-act="del" data-k="${k}" aria-label="Delete">&times;</button>
          </span>
        </li>`;
      }).join('');
    }
    addName.value = '';
    addUrl.value = '';
  }

  // Title / category inline edits
  mTitle.addEventListener('input', () => {
    if (currentIdx < 0) return;
    DATA[currentIdx].title = mTitle.value || 'Untitled';
    saveData(); render(); renderChips();
  });
  mCat.addEventListener('input', () => {
    if (currentIdx < 0) return;
    DATA[currentIdx].cat = mCat.value || 'Misc';
    saveData(); render(); renderChips();
  });

  // List row actions (event delegation)
  mList.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    const k = Number(btn.dataset.k);
    if (act === 'edit') {
      editingLink = k; renderModal();
      setTimeout(() => mList.querySelector('.e-name')?.focus(), 0);
    } else if (act === 'del') {
      DATA[currentIdx].items.splice(k, 1); saveData(); render(); renderModal();
    } else if (act === 'cancel') {
      editingLink = -1; renderModal();
    } else if (act === 'save') {
      const li = btn.closest('li');
      const name = li.querySelector('.e-name').value.trim();
      const url  = li.querySelector('.e-url').value.trim();
      if (!name || !url) return;
      DATA[currentIdx].items[Number(btn.dataset.k)] = { name, url };
      editingLink = -1; saveData(); render(); renderModal();
    }
  });
  mList.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.target.classList.contains('e-name') || e.target.classList.contains('e-url'))) {
      const btn = e.target.closest('li')?.querySelector('[data-act="save"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // Add link
  function addLink() {
    if (currentIdx < 0) return;
    const name = addName.value.trim();
    const url = addUrl.value.trim();
    if (!name || !url) return;
    DATA[currentIdx].items.push({ name, url });
    saveData(); render(); renderModal();
    setTimeout(() => addName.focus(), 0);
  }
  addBtn.addEventListener('click', addLink);
  [addName, addUrl].forEach(inp => inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addLink(); }
  }));

  // Delete card (two-click confirm)
  delCardBtn.addEventListener('click', () => {
    if (!delCardBtn.classList.contains('confirm')) {
      delCardBtn.classList.add('confirm');
      delCardBtn.textContent = 'Click again to delete';
      setTimeout(() => { delCardBtn.classList.remove('confirm'); delCardBtn.textContent = 'Delete card'; }, 3000);
      return;
    }
    DATA.splice(currentIdx, 1);
    saveData(); closeModal(); render(); renderChips();
  });

  // FAB — new card
  fab.addEventListener('click', () => {
    DATA.unshift({ cat: activeCat !== 'All' ? activeCat : 'Misc', title: 'Untitled', items: [] });
    saveData(); renderChips(); render(); openModal(0);
    setTimeout(() => { mTitle.select(); }, 50);
  });

  // Scrim / search / close
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(); });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  q.addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });

  // Publish
  if (publishBtn) publishBtn.addEventListener('click', publishToGitHub);

  // Boot
  applyMode();
  initialLoad();
</script>
